# *******************************************************************************
# *                                                                             *
# *   NEOPIXEL STATUS LED CONFIGURATION - by Gegemon                          *
# *   For Klipper with klipper-led_effect plugin                              *
# *   https://github.com/JulienLoisel/klipper-led_effect                     *
# *                                                                             *
# *******************************************************************************
#   This file defines:
#   - A NeoPixel strip (status_led) with 32 LEDs on pin mcu2:PC9.
#   - Two LED effects: blue breathing and red strobe.
#   - Macros to start/stop these effects manually.
#   - Automatic display of print progress via the NeoPixel strip.
#   - Bed temperature colour indication when idle.
#   - Background loop to update the temperature display.
#
#   Adjust pin, chain_count and color_order to match your hardware.
# *******************************************************************************

# ======================================================================================================================
#  NEOPIXEL HARDWARE DEFINITION
# ======================================================================================================================
[neopixel status_led]
pin: mcu2:PC9                 # Pin connected to the NeoPixel data line
chain_count: 32               # Number of LEDs in the strip
color_order: GRB              # Colour order (GRB for WS2812B, RGB for others)
initial_RED: 0.0              # Default red component (off)
initial_GREEN: 0.5            # Default green component (50% brightness) - shows green when idle
initial_BLUE: 0.0             # Default blue component (off)

# ======================================================================================================================
#  LED EFFECTS (via led_effect plugin)
# ======================================================================================================================
# Effect 1: Blue breathing (calm, pulsing blue)
[led_effect blue_breath]
autostart: false              # Do not start automatically; we control via macros
frame_rate: 50                # Frames per second for smooth animation
leds:
    neopixel:status_led       # Apply to the status_led strip
layers:
    breathing 3 0 top (0.0, 0.0, 0.5)   # Breathing: period 3s, phase 0, colour blue (R=0,G=0,B=0.5)

# Effect 2: Red strobe (fast flashing red - alarm/warning)
[led_effect red_strobe]
autostart: false
frame_rate: 24
leds:
    neopixel:status_led
layers:
    strobe 2 1.5 top (0.5,0.0,0.0)      # Strobe: period 2s, duty 1.5s on, colour red

# ======================================================================================================================
#  MANUAL EFFECT MACROS (PAUSE / RESUME)
# ======================================================================================================================
# Start the blue breathing effect (e.g., when paused)
[gcode_macro START_BLUE_BREATH]
gcode:
    SET_LED_EFFECT EFFECT=blue_breath

# Stop the blue breathing effect
[gcode_macro STOP_BLUE_BREATH]
gcode:
    SET_LED_EFFECT EFFECT=blue_breath STOP=1

# ======================================================================================================================
#  RED STROBE EFFECT FOR CANCEL / EMERGENCY
# ======================================================================================================================
# Delayed gcode to stop the strobe after a timeout (can be triggered after cancel)
[delayed_gcode stop_strobe_after_cancel]
initial_duration: 0           # Will be set dynamically when needed
gcode:
    SET_LED_EFFECT EFFECT=red_strobe STOP=1
    START_TEMP_MONITOR        # Re-enable temperature monitoring after strobe stops

# ======================================================================================================================
#  AUTOMATIC PRINT PROGRESS DISPLAY
# ======================================================================================================================
# Start showing print progress on the LEDs (from virtual_sdcard progress)
[gcode_macro START_PRINT_PROGRESS]
gcode:
    STOP_TEMP_MONITOR         # Disable temperature monitoring while printing (to avoid conflicts)
    NEOPIXEL_DISPLAY LED="status_led" TYPE=print_percent MODE=progress

# Stop showing print progress (clear the LEDs)
[gcode_macro STOP_PRINT_PROGRESS]
gcode:
    NEOPIXEL_DISPLAY LED="status_led" TYPE=none MODE=none
    START_TEMP_MONITOR        # Re-enable temperature monitoring after print ends

# Alias for end of print
[gcode_macro END_PRINT_PROGRESS]
gcode:
    STOP_PRINT_PROGRESS

# ======================================================================================================================
#  BED TEMPERATURE INDICATION (outside printing)
# ======================================================================================================================
# This section uses a background loop to read the bed temperature and set the LED colour:
#   - >100°C -> Red
#   - 85-100°C -> Orange
#   - 50-85°C -> Yellow
#   - <50°C   -> Green
# The LED is updated every 4 seconds via a delayed_gcode loop.

# Macro that holds the enable/disable state of the temperature monitor (1=enabled, 0=disabled)
[gcode_macro _TEMP_MONITOR_STATE]
variable_enable: 1            # Start enabled
gcode:

# Macro that reads bed temperature and updates the LED (if monitor is enabled and printer is idle)
[gcode_macro UPDATE_BED_TEMP_LED]
gcode:
    {% if printer["gcode_macro _TEMP_MONITOR_STATE"].enable == 1 %}
        {% set state = printer.print_stats.state %}
        {% if state not in ['printing', 'paused'] %}   # Only show temperature when not printing/paused
            {% set temp = printer.heater_bed.temperature %}
            {% if temp > 100 %}
                SET_LED LED=status_led RED=0.5 GREEN=0.0 BLUE=0.0     # Red
            {% elif temp > 85 %}
                SET_LED LED=status_led RED=0.5 GREEN=0.25 BLUE=0.0    # Orange
            {% elif temp > 50 %}
                SET_LED LED=status_led RED=0.5 GREEN=0.5 BLUE=0.0     # Yellow
            {% else %}
                SET_LED LED=status_led RED=0.0 GREEN=0.5 BLUE=0.0     # Green
            {% endif %}
        {% endif %}
    {% endif %}

# Delayed gcode that calls UPDATE_BED_TEMP_LED every 4 seconds (self‑repeating)
[delayed_gcode update_temp_loop]
initial_duration: 0.1         # First call after 0.1s
gcode:
    UPDATE_BED_TEMP_LED
    UPDATE_DELAYED_GCODE ID=update_temp_loop DURATION=4

# Macro to enable the temperature monitor
[gcode_macro START_TEMP_MONITOR]
gcode:
    SET_GCODE_VARIABLE MACRO=_TEMP_MONITOR_STATE VARIABLE=enable VALUE=1
    UPDATE_BED_TEMP_LED

# Macro to disable the temperature monitor
[gcode_macro STOP_TEMP_MONITOR]
gcode:
    SET_GCODE_VARIABLE MACRO=_TEMP_MONITOR_STATE VARIABLE=enable VALUE=0

# Auto‑start the temperature monitor when Klipper starts (after a short delay)
[delayed_gcode startup_delay]
initial_duration: 1
gcode:
    START_TEMP_MONITOR

# ======================================================================================================================
#  NEOPIXEL DISPLAY ENGINE (templates for print progress)
# ======================================================================================================================
# This macro handles the display of various patterns on the LED strip.
# It is called by START_PRINT_PROGRESS with TYPE=print_percent and MODE=progress.
# It sets a template for each LED based on the current print progress ratio.
# The templates use display templates defined below.

[gcode_macro NEOPIXEL_DISPLAY]
gcode:
    {% set led = params.LED %}
    {% set type = params.TYPE %}
    {% set mode = params.MODE %}
    {% set my_neopixel = printer.configfile.config['neopixel ' ~ led] %}
    {% set total = my_neopixel.chain_count|int %}

    {% if mode == 'none' %}
        # Clear all templates and turn off LEDs
        SET_LED_TEMPLATE LED={led} TEMPLATE=""
        SET_LED LED={led} RED=0 GREEN=0 BLUE=0
    {% else %}
        {% if type != 'none' %}
            {% if mode == 'progress' %}
                # For each LED, assign a template that will compute its colour based on progress
                {% for i in range(total) %}
                    {% set reversed_num = total - i %}   # Reverse order so LED 0 is the "end" of the bar
                    SET_LED_TEMPLATE LED={led} INDEX={i+1} TEMPLATE={'led_' ~ type ~ '_' ~ mode} param_led_num={reversed_num} param_led_total={total}
                {% endfor %}
            {% endif %}
        {% endif %}
    {% endif %}

# ----------------------------------------------------------------------------------------------------------------------
#  DISPLAY TEMPLATE: glow effect (unused but kept as example)
# ----------------------------------------------------------------------------------------------------------------------
[display_template led_print_percent_glow]
text:
    {% set ratio = printer.virtual_sdcard.progress %}
    0.0, {ratio}, 0.0, 0.0        # Green intensity varies with progress (0-1), but this template is not used.

# ----------------------------------------------------------------------------------------------------------------------
#  DISPLAY TEMPLATE: progress bar (fills LEDs from one end)
# ----------------------------------------------------------------------------------------------------------------------
[display_template led_print_percent_progress]
param_led_num:  0
param_led_total: 1
text:
    {% set ratio = printer.virtual_sdcard.progress %}
    {% set led_ratio = param_led_num|float / param_led_total %}
    # Each LED is either "on" (purple) if its position is less than the progress, else "off" (grey/dim)
    {% if ratio > led_ratio %}
        0.4, 0.0, 0.4, 0.0        # Purple (R=0.4, G=0, B=0.4), fully bright (W=0)
    {% else %}
        0.5, 0.5, 0.5, 0.5        # White-ish at low brightness (to show unfilled LEDs)
    {% endif %}

# ======================================================================================================================
#  END OF CONFIGURATION
# ======================================================================================================================